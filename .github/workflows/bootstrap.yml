name: WattGuard Bootstrap Deploy

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct public deploy tree
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .bootstrap/chunk-* > /tmp/wattguard-deploy.b64
          base64 -d /tmp/wattguard-deploy.b64 > /tmp/wattguard-deploy.tar.gz
          rm -rf .bootstrap
          tar -xzf /tmp/wattguard-deploy.tar.gz -C .
          # CI workflow is installed separately through the authorized connector.
          rm -f .github/workflows/live-capture-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize WattGuard deploy"
          git push origin main
