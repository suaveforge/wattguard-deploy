name: Capture actual WattGuard app pages for OPM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opm-capture.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install playwright --no-save --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Capture six distinct actual app states
        run: |
          mkdir -p opm-registration/images
          python3 -m http.server 8989 --bind 127.0.0.1 >/tmp/wattguard-server.log 2>&1 &
          cat > /tmp/capture-opm.cjs <<'JS'
          const { chromium }=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:450,height:870},deviceScaleFactor:2,reducedMotion:'reduce',locale:'ko-KR'});
            const page=await context.newPage();
            page.on('pageerror',e=>console.error('PAGE ERROR',e.message));
            const base='http://127.0.0.1:8989/';
            await page.goto(base+'#/home',{waitUntil:'networkidle'});
            if(await page.locator('#quick-demo').count()) await page.locator('#quick-demo').click();
            async function capture(file,route,scenario,step,expected){
              await page.evaluate(({route,scenario,step})=>{
                localStorage.setItem('wattguardScenario',scenario);
                localStorage.setItem('wattguardStep',step);
                location.hash='#/'+route;
              },{route,scenario,step});
              await page.reload({waitUntil:'networkidle'});
              await page.waitForSelector('.app-shell',{state:'visible',timeout:20000});
              await page.evaluate(()=>{window.scrollTo(0,0);document.querySelectorAll('*').forEach(e=>{e.style.animation='none';e.style.transition='none'})});
              await page.waitForTimeout(250);
              const t=(await page.locator('#app').innerText()).replace(/\s+/g,' ');
              if(!t.includes(expected))throw Error(file+' expected '+expected+' but got '+t.slice(0,300));
              if(file==='05_alerts.png'&&t.includes('아직 알림 기록이 없습니다'))throw Error('alerts empty');
              const path='opm-registration/images/'+file;
              await page.screenshot({path,fullPage:false,animations:'disabled'});
              console.log('CAPTURE OK',file,'route=',route,'text=',t.slice(0,180));
            }
            await capture('01_normal.png','home','A','full','현재 전력은 평소 범위 안입니다');
            await capture('02_anomaly.png','home','B','attention','추정 누수비용');
            await capture('03_detail.png','detail','B','attention','이상 상세');
            await capture('04_history.png','history','B','attention','전력 사용 히스토리');
            await capture('05_alerts.png','alerts','B','attention','알림 기록');
            await capture('06_evidence.png','evidence','B','attention','원출처 우선');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/capture-opm.cjs
      - name: Commit screenshots to deploy repository
        run: |
          git config user.name 'WattGuard capture'
          git config user.email 'actions@users.noreply.github.com'
          git add opm-registration/images/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Capture six distinct actual WattGuard app states for OPM"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Capture push failed after retries" >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opm-actual-app-screens
          path: opm-registration/images/
          if-no-files-found: ignore
